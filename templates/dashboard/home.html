<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpaceGuard AI — No Active Missions</title>
  {% load static %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/spaceguard.css' %}">
</head>
<body>
<nav class="navbar navbar-dark navbar-spaceguard">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
      <i class="bi bi-satellite fs-4 text-primary-accent"></i>
      <span class="fw-bold">SpaceGuard AI</span>
    </a>
  </div>
</nav>
<main class="main-content d-flex align-items-center justify-content-center" style="min-height:70vh;">
  <div class="text-center">
    <i class="bi bi-satellite fs-1 text-muted mb-3 d-block"></i>
    <h3 class="text-white mb-2">No Active Missions</h3>
    <p class="text-muted mb-4">Seed the database to begin mission monitoring.</p>
    <code class="text-accent d-block mb-3">python manage.py seed_telemetry</code>
    {% if missions %}
    <div class="mt-4">
      <p class="text-muted">All missions:</p>
      {% for m in missions %}
        <a href="/missions/{{ m.pk }}/" class="btn btn-outline-secondary btn-sm me-2">{{ m.spacecraft_name }}</a>
      {% endfor %}
    </div>
    {% endif %}
    <a href="/admin/" class="btn btn-primary mt-4">Open Admin Panel</a>
  </div>
</main>
</body>
</html>
